plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.thebreadchapter.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.thebreadchapter.pos"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Pine Labs SDK bundles native .so files via JNA; strip duplicates from the APK.
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libjnidispatch.so'
        pickFirst 'lib/armeabi-v7a/libjnidispatch.so'
        pickFirst 'lib/x86/libjnidispatch.so'
        pickFirst 'lib/x86_64/libjnidispatch.so'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    // Pine Labs AppToApp billing SDK
    implementation 'com.pinelabs.billing:pine-billing-sdk-android:0.19.0-rc.1'
}
