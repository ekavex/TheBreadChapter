# CI pipeline for this repository - NOT ACTIVE FROM THIS PATH.
#
# GitHub only runs workflows stored at .github/workflows/. This copy lives here
# because writing that directory requires a token with the `workflow` scope,
# which the pushing account does not have.
#
# To activate (either route):
#   • Web UI: GitHub → Actions → "set up a workflow yourself" → paste this file
#     → commit as .github/workflows/ci.yml
#   • Locally, with a token that has the `workflow` scope:
#       mkdir -p .github/workflows && cp ci/github-ci.yml .github/workflows/ci.yml
#       git add .github/workflows/ci.yml && git commit -m "ci: add pipeline" && git push
#
# Until then the 10 payment integration tests never execute anywhere: they need
# a live Postgres, which this pipeline provides via a service container.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    # Real Postgres so the payment integration matrix (transactions, row locks,
    # partial unique indexes) actually runs instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: breadchapter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/breadchapter_test
      AUTH_SESSION_SECRET: ci-secret-not-used-in-production
      DATABASE_URL: postgresql://postgres:test@localhost:5432/breadchapter_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (unit + payment integration matrix)
        run: npm test

      - name: Production build
        run: npm run build

  payment-safety:
    name: Payment safety guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These greps encode audit findings that must never regress. They are
      # cheap, and each one maps to a way this system could lose money.
      - name: No module may import the live provider from MockPaymentProvider
        run: |
          if grep -rnE "import \{[^}]*paymentProvider[^}]*\} from '[^']*MockPaymentProvider'" src --include=*.ts; then
            echo "::error::provider selection must come from lib/payment/provider.ts, which refuses the mock in production"
            exit 1
          fi

      - name: A pending payment must never be written as failed
        run: |
          if grep -rn "status === 'pending'" src/app/api/pos/orders/*/pay/route.ts >/dev/null; then
            echo "pending is handled explicitly - ok"
          else
            echo "::error::pay route no longer handles the 'pending' state explicitly"
            exit 1
          fi

      - name: Webhook must verify with GetStatus before finalizing
        run: |
          grep -q "paymentProvider.status" src/app/api/webhooks/pinelabs/route.ts || {
            echo "::error::webhook finalizes without re-verifying via GetStatus"
            exit 1
          }
